<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Battle Lab</title>
<meta name="description" content="Thử trận đấu 1v1 giữa hai Pokémon: chỉnh chỉ số, đồ giữ, chiêu thức, tính cách, EV/IV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e5484d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Pocket Battle Lab</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="A" id="tab-A">A</button>
      <button role="tab" data-tab="B" id="tab-B">B</button>
      <button role="tab" data-tab="battle" id="tab-battle">Đấu</button>
    </nav>
  </header>
  <main>
    <section id="view-A" class="view" hidden></section>
    <section id="view-B" class="view" hidden></section>
    <section id="view-battle" class="view" hidden></section>
  </main>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
<noscript>Trang này cần JavaScript.</noscript>
</body>
</html>
